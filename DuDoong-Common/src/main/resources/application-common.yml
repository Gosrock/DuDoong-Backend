# 비밀값은 기본값을 두지 않는다 (#764). 로컬은 application-common-local.yml, 테스트는 build.gradle.kts 의 test 설정이 값을 준다
auth:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-exp: ${JWT_ACCESS_EXP:3600}
    refresh-exp: ${JWT_REFRESH_EXP:3600}

oauth:
  kakao:
    base-url: ${KAKAO_BASE_URL}
    client-id: ${KAKAO_CLIENT}
    client-secret: ${KAKAO_SECRET}
    redirect-url: ${KAKAO_REDIRECT}
    app-id: ${KAKAO_APP_ID}
    admin-key: ${KAKAO_ADMIN_KEY}

toss:
  secret-key: ${TOSS_PAYMENTS_KEY}
  mid : ${TOSS_MID}