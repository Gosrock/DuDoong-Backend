# commons
api:
  prefix : ${API_PREFIX:/api}

logging:
  pattern:
    console: "[%d{HH:mm:ss.SSS}] [%X{traceId:-no-trace}] [%-5level] %logger{36} - %msg%n"
spring:
  profiles:
    include:
      - infrastructure
      - domain
      - common
    group:
      local: infrastructure, domain-local, common-local
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
springdoc:
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  swagger-ui:
    tags-sorter: alpha

server:
  forward-headers-strategy: framework

throttle:
  overdraft: ${RATE_LIMIT_OVERDRAFT:60}
  greedyRefill: ${RATE_LIMIT_REFILL:60}

acl.whiteList : ${ACL_WHITELIST:127.0.0.1,127.0.0.2}
---
spring:
  config:
    activate:
      on-profile: dev
#logging:
#  level:
#    root: info
#logging:
#  level:
#    org.springframework.data.*.*: debug
#    org.springframework.cache.*: debug
---
spring:
  config:
    activate:
      on-profile: staging
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    ROOT: WARN
