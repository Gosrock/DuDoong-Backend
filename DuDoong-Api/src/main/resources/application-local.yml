# 로컬 전용 AWS 키 자리값 (#764). application-infrastructure.yml 의 ${AWS_ACCESS_KEY}·${AWS_SECRET_KEY} 자리에 들어간다 (환경변수가 있으면 환경변수가 우선)
AWS_ACCESS_KEY: local-access-key
AWS_SECRET_KEY: local-secret-key

swagger:
  user: user
  password: password

# 요청 제한 E2E(#764)는 RATE_LIMIT_OVERDRAFT·RATE_LIMIT_REFILL 을 낮춰 띄운다
throttle:
  overdraft: ${RATE_LIMIT_OVERDRAFT:9999}
  greedyRefill: ${RATE_LIMIT_REFILL:9999}

acl.whiteList: 127.0.0.1,127.0.0.2

logging:
  level:
    band.gosrock: DEBUG
