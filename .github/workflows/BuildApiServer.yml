name: Build Api Server
on:
  push:
    tags:
      - Api-v*.*.*
  # 이미 배포된 버전을 같은 소스로 다시 빌드할 때 사용 (예: ref=Api-v2.2.5, version=2.2.5)
  workflow_dispatch:
    inputs:
      ref:
        description: '빌드할 git 태그 (예: Api-v2.2.5)'
        required: true
        type: string
      version:
        description: '이미지 태그 (비우면 ref 에서 추출, 예: 2.2.5). 지정하면 ref 의 버전과 같아야 한다'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 21 ]
    outputs:
      version: ${{ steps.get_version.outputs.BRANCH_NAME }}

    steps:
      # 빌드할 태그와 이미지 버전을 먼저 확정한다.
      # 수동 실행 시 ref 는 Api-vX.Y.Z 태그만 허용하고 refs/tags/ 로 고정해 브랜치·포크 PR ref(refs/pull/...) 빌드를 막는다.
      # version 은 ref 에서 뽑은 버전과 같아야 한다 (다른 버전 이미지 태그 덮어쓰기 방지).
      - name: Get the version
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_REF"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          TAG_RE='^Api-v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$'
          if ! [[ "$TAG" =~ $TAG_RE ]]; then
            echo "태그 형식이 잘못됨(Api-vX.Y.Z 필요): '$TAG'" >&2
            exit 1
          fi
          RELEASE_VERSION_WITHOUT_V="${BASH_REMATCH[1]}"
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$RELEASE_VERSION_WITHOUT_V" ]; then
            echo "version('$INPUT_VERSION')이 ref 의 버전('$RELEASE_VERSION_WITHOUT_V')과 다름" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_VERSION_WITHOUT_V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "이미지 태그 형식이 잘못됨: '$RELEASE_VERSION_WITHOUT_V'" >&2
            exit 1
          fi
          echo "REF=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=$RELEASE_VERSION_WITHOUT_V" >> "$GITHUB_OUTPUT"

      - name: Check Out The Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_version.outputs.REF }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      #테스트 수행용 도커 컴포즈
      - name: Start containers
        run: docker compose up -d

      - name: Gradle Build
        uses: gradle/gradle-build-action@v3

      - name: Execute Gradle build
        run: ./gradlew :DuDoong-Api:build --no-daemon

      # arm64 이미지 빌드용 에뮬레이션 (jar 는 위에서 만들고 Dockerfile 은 COPY 만 하므로 부담이 작다)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./DuDoong-Api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: water0641/dudoong-api:${{ steps.get_version.outputs.VERSION }}
